name: Keep Supabase awake

# Supabase pauses free projects after about a week with little activity, which turns off sync and bug reports.
# This makes one small read every 3 days so the project stays active. If the request fails (for example the
# project is already paused), the run fails and GitHub emails the repo owner.
# GitHub turns off scheduled workflows after 60 days with no commits; it emails you, and re-enabling is one click
# under Actions → Keep Supabase awake.

on:
  schedule:
    - cron: '17 14 */3 * *' # every 3 days, mid-morning Eastern
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase isn't configured for this repo (no VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY variables); nothing to keep awake."
            exit 0
          fi
          # Reading the bug_reports table returns nothing to the public, but it is a real database request.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/bug_reports?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Project is awake."
          else
            echo "::error::Supabase didn't answer normally (HTTP $status). If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
